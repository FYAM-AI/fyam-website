<!doctype html>
<html lang="en">
<head>
    <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report an incident · Smart Summarise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#10243a; --blue:#2f78b7; --teal:#1c9a91; --ink:#172536; --muted:#4f5f70; --line:#dce5ed; --bg:#f4f7fa; --red:#b42318; --amber:#a8620c; --green:#1c8a5e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 Inter, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    header { background: linear-gradient(150deg, #0e2238, #173a56); color: #fff; padding: 22px 20px 26px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .12em; }
    .mark { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(145deg,#1b4968,#2e8a9a); display: grid; place-items: center; letter-spacing: 0; }
    header h1 { font-size: 24px; margin: 16px 0 4px; letter-spacing: -.02em; }
    header p { margin: 0; color: #c4d4e0; font-size: 15px; }
    main { padding: 18px 16px 40px; max-width: 560px; margin: 0 auto; }
    .warn { background: #fbe9e6; color: var(--red); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    label { display: grid; gap: 6px; font-weight: 600; font-size: 15px; margin-bottom: 14px; }
    input, select, textarea { font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #fff; width: 100%; }
    textarea { min-height: 110px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #73c9c0; border-color: transparent; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; }
    button:disabled { opacity: .7; }
    .ex { background: none; color: var(--blue); min-height: 40px; font-size: 15px; margin-bottom: 8px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 14px; }
    .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--teal); margin: 0 0 6px; }
    .card p { margin: 0; }
    .risk { display: inline-block; font-weight: 800; padding: 4px 12px; border-radius: 999px; }
    .High { background: #fbe9e6; color: var(--red); } .Medium { background: #fdf1df; color: var(--amber); } .Low { background: #e3f4ec; color: var(--green); }
    .err { color: var(--red); font-weight: 600; margin-top: 12px; }
    .spin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; border-right-color: transparent; animation: s .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
    @keyframes s { to { transform: rotate(360deg); } }
    ul { margin: 0; padding-left: 20px; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark">F</span>FYAM · Smart Summarise</div>
    <h1>Report an incident</h1>
    <p>Describe what happened in your own words. Smart Summarise will review it in seconds.</p>
  </header>
  <main>
    <div class="warn">Demo only – please use a made-up name. Never enter details of a real person.</div>
    <button type="button" class="ex" id="example">Fill with an example</button>
    <form id="f">
      <label>Event code <input id="code" autocomplete="off" autocapitalize="characters" placeholder="Shown on the big screen"></label>
      <label>Made-up resident name <input id="who" maxlength="40" placeholder="e.g. Sam Taylor" required></label>
      <label>Service <select id="where"><option>Maple House</option><option>Oak View</option><option>Rose Court</option></select></label>
      <label>What happened? <textarea id="what" maxlength="1500" required placeholder="Describe the incident"></textarea></label>
      <label>What did staff do? <textarea id="did" maxlength="1000" placeholder="Immediate actions taken"></textarea></label>
      <label>Any injury? <select id="injury"><option>None</option><option>Minor</option><option>Moderate</option><option>Serious</option></select></label>
      <button type="submit" id="go">Send to Smart Summarise</button>
      <p class="err" id="err" hidden></p>
    </form>
    <div id="out"></div>
  </main>
  <script src="./config.js?v=3"></script>
  <script>
  {
    const api = ((window.SS_CONFIG || {}).apiBase || "").replace(/\/$/, "");
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    if ((window.SS_CONFIG || {}).eventCode === "") $("code").closest("label").hidden = true;
    $("example").addEventListener("click", () => {
      $("who").value = "Sam Taylor";
      $("what").value = "During lunch Sam became upset when another resident took his seat. He shouted, pushed the chair over and walked out of the front door towards the main road. Staff followed at a distance and talked to him calmly.";
      $("did").value = "Staff kept Sam in sight, reassured him and he came back inside after 10 minutes. The on-call manager was informed.";
    });
    $("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("err").hidden = true;
      if (!api) { $("err").textContent = "The live demo is not connected yet."; $("err").hidden = false; return; }
      const go = $("go"); go.disabled = true; go.innerHTML = '<span class="spin"></span>Smart Summarise is reviewing…';
      try {
        const r = await fetch(api + "/api/submit", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({
          workflow: "incident", code: $("code").value,
          fields: { "Residents Involved": $("who").value, "Service Location": $("where").value, "Incident Description": $("what").value, "Immediate Actions Taken": $("did").value, "Injury Type": $("injury").value, "Date & Time of Incident": new Date().toLocaleString("en-GB") }
        }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "Something went wrong");
        const o = d.output;
        $("out").innerHTML = `
          <div class="card"><h2>Risk level</h2><span class="risk ${esc(o.risk_level)}">${esc(o.risk_level)}</span></div>
          <div class="card"><h2>AI summary</h2><p>${esc(o.ai_summary)}</p></div>
          <div class="card"><h2>Safeguarding</h2><p>${esc(o.safeguarding_considerations)}</p></div>
          <div class="card"><h2>Suggested actions</h2><ul>${o.suggested_actions.map((a) => `<li>${esc(a)}</li>`).join("")}</ul></div>
          <p style="text-align:center;color:var(--muted);margin-top:16px">Look at the big screen – your incident is now in the manager's dashboard.</p>`;
        $("out").scrollIntoView({ behavior: "smooth" });
        $("f").reset();
      } catch (err) {
        $("err").textContent = err.message; $("err").hidden = false;
      } finally { go.disabled = false; go.textContent = "Send to Smart Summarise"; }
    });
  }
  </script>
</body>
</html>
